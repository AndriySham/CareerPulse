services:
  postgres:
    image: postgres:16-alpine
    container_name: careerpulse_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: careerpulse
      POSTGRES_USER: careerpulse
      POSTGRES_PASSWORD: careerpulse_dev
    ports:
      - "5432:5432"
    volumes:
      - careerpulse_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U careerpulse -d careerpulse"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  careerpulse_pgdata:
    driver: local
